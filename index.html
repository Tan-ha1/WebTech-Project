<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Report Found Item</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h2>Report a Found Item</h2>

    <form id="myForm" novalidate>

      <!-- Item name -->
      <div class="form-group">
        <label for="itemName">Item Name</label>
        <input type="text" id="itemName" placeholder="e.g. Black Wallet">
        <span class="error" id="itemNameError"></span>
      </div>

      <!-- Description -->
      <div class="form-group">
        <label for="description">Description</label>
        <textarea id="description" rows="3" placeholder="Colour, brand, size, condition"></textarea>
        <span class="error" id="descriptionError"></span>
      </div>

      <!-- Exact location -->
      <div class="form-group">
        <label for="location">Exact Location</label>
        <input type="text" id="location" placeholder="e.g. Room 304, Building D">
        <span class="error" id="locationError"></span>
      </div>

      <!-- Date found -->
      <div class="form-group">
        <label for="dateFound">Date Found</label>
        <input type="date" id="dateFound">
        <span class="error" id="dateFoundError"></span>
      </div>

      <!-- Where is the item now -->
      <div class="form-group">
        <label>Where is the item now?</label>
        <div class="options">
          <label><input type="radio" name="itemNow" value="With me"> With me</label>
          <label><input type="radio" name="itemNow" value="Security Office"> Security Office</label>
          <label><input type="radio" name="itemNow" value="Left where found"> Left where found</label>
        </div>
        <span class="error" id="itemNowError"></span>
      </div>

      <!-- Role -->
      <div class="form-group">
        <label>I am a</label>
        <div class="options">
          <label><input type="radio" name="role" value="Student"> Student</label>
          <label><input type="radio" name="role" value="Faculty/Staff"> Faculty / Staff</label>
        </div>
        <span class="error" id="roleError"></span>
      </div>

      <!-- Name -->
      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" placeholder="Enter your name">
        <span class="error" id="nameError"></span>
      </div>

      <!-- Email -->
      <div class="form-group">
        <label for="email">Email</label>
        <input type="text" id="email" placeholder="Enter your email">
        <span class="error" id="emailError"></span>
      </div>

      <!-- Phone -->
      <div class="form-group">
        <label for="phone">Phone Number</label>
        <input type="text" id="phone" placeholder="01XXXXXXXXX">
        <span class="error" id="phoneError"></span>
      </div>

      <!-- Confirmation -->
      <div class="form-group">
        <div class="options">
          <label><input type="checkbox" name="confirm" value="yes"> I confirm this item was found on campus and the information is true.</label>
        </div>
        <span class="error" id="confirmError"></span>
      </div>

      <button type="submit">Submit Report</button>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
